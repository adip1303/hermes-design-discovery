name: design-discovery
version: "0.1.1"
manifest_version: 1
api_version: 1
description: >
  Persistent design-discovery state with an agent toolset and a native Hermes
  Desktop workbench pane. State is stored only in this plugin's data directory.
author: Adhip
license: MIT
requires_hermes: ">=0.23.0"
tags: [desktop, design, tools]
provides_tools:
  - design_discovery_generate_directions
  - design_discovery_record_understanding
  - design_discovery_update_choice
  - design_discovery_get_state
  - design_discovery_export_design_md
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
